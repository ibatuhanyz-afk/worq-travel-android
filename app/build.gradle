plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worq.travel'
    compileSdk 35

    defaultConfig {
        applicationId "com.worq.travel.mobile"
        minSdk 23
        targetSdk 35
        versionCode 24
        versionName "2.4-native-splash-location"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
