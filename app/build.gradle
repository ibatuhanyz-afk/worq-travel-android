plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worq.travel'
    compileSdk 35

    defaultConfig {
        applicationId "com.worq.travel.firmas"
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName "3.1.4-github-pin-stability"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
