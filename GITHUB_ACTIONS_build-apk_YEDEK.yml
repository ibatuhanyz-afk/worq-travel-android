name: Worq Travel APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK adini duzelt
        run: cp app/build/outputs/apk/debug/app-debug.apk Worq-Travel.apk

      - name: APK artefaktini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Worq-Travel-Android-APK
          path: Worq-Travel.apk
          if-no-files-found: error
          retention-days: 30
